<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Package dependencies</title>
  <desc id="desc">Quartz ingress depends on orbit metrics and lumen cache.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#555"/></marker></defs>
  <rect width="960" height="540" fill="#0a0a1a"/>
  <text x="48" y="52" fill="#e0e0e0" font-family="sans-serif" font-size="28" font-weight="700">Dependency edges</text>
  <text x="48" y="82" fill="#9aa" font-family="sans-serif" font-size="16">Package relationships remain visible alongside upgrade history.</text>
  <line x1="700" y1="240" x2="330" y2="165" stroke="#777" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <line x1="700" y1="300" x2="330" y2="380" stroke="#777" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <circle cx="700" cy="270" r="40" fill="#CC79A7" stroke="#fff" stroke-width="3"/>
  <circle cx="300" cy="165" r="30" fill="#009E73"/><circle cx="300" cy="380" r="30" fill="#0072B2"/>
  <text x="630" y="355" fill="#e0e0e0" font-family="sans-serif" font-size="18">quartz-ingress</text>
  <text x="215" y="125" fill="#e0e0e0" font-family="sans-serif" font-size="18">orbit-metrics</text>
  <text x="205" y="435" fill="#e0e0e0" font-family="sans-serif" font-size="18">lumen-cache</text>
  <text x="440" y="180" fill="#aaa" font-family="sans-serif" font-size="16">packageDep</text>
  <text x="440" y="365" fill="#aaa" font-family="sans-serif" font-size="16">packageDep</text>
  <text x="48" y="505" fill="#9aa" font-family="sans-serif" font-size="15">Dashed gray links represent dependencies; use the dependency toggle to hide them.</text>
</svg>
