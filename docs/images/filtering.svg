<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Focused filtering</title>
  <desc id="desc">A dense graph reduced to a focused package using the search filter.</desc>
  <rect width="960" height="540" fill="#0a0a1a"/>
  <text x="48" y="52" fill="#e0e0e0" font-family="sans-serif" font-size="28" font-weight="700">Focused filtering</text>
  <text x="48" y="82" fill="#9aa" font-family="sans-serif" font-size="16">Search reduces a large graph to the package under investigation.</text>
  <rect x="60" y="125" width="840" height="58" rx="8" fill="#1a1a2e" stroke="#556"/>
  <text x="85" y="162" fill="#88CCEE" font-family="monospace" font-size="20">lumen-cache</text>
  <text x="60" y="225" fill="#777" font-family="sans-serif" font-size="15">before: 18 nodes / 26 links</text>
  <text x="540" y="225" fill="#88CCEE" font-family="sans-serif" font-size="15">after: 4 nodes / 3 links</text>
  <g fill="#444" opacity=".5"><circle cx="115" cy="285" r="10"/><circle cx="180" cy="350" r="10"/><circle cx="245" cy="275" r="10"/><circle cx="310" cy="385" r="10"/><circle cx="385" cy="300" r="10"/><circle cx="430" cy="400" r="10"/></g>
  <line x1="115" y1="285" x2="180" y2="350" stroke="#555"/><line x1="180" y1="350" x2="310" y2="385" stroke="#555"/><line x1="245" y1="275" x2="385" y2="300" stroke="#555"/>
  <circle cx="610" cy="285" r="22" fill="#0072B2"/><circle cx="705" cy="350" r="22" fill="#0072B2"/><circle cx="800" cy="285" r="28" fill="#0072B2" stroke="#fff" stroke-width="2"/><line x1="610" y1="285" x2="705" y2="350" stroke="#56B4E9" stroke-width="3"/><line x1="705" y1="350" x2="800" y2="285" stroke="#56B4E9" stroke-width="3"/>
  <text x="48" y="490" fill="#9aa" font-family="sans-serif" font-size="15">Use --package before launch or the viewer search field interactively.</text>
</svg>
