<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Cross-revision continuity</title>
  <desc id="desc">Lumen cache bundle heads connected across two catalog revision planes.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#009E73"/></marker></defs>
  <rect width="960" height="540" fill="#0a0a1a"/>
  <text x="48" y="52" fill="#e0e0e0" font-family="sans-serif" font-size="28" font-weight="700">Cross-revision continuity</text>
  <text x="48" y="82" fill="#9aa" font-family="sans-serif" font-size="16">The same package is shown on adjacent revision planes.</text>
  <polygon points="90,155 445,120 445,440 90,475" fill="#15152b" stroke="#455" stroke-width="2"/>
  <polygon points="515,120 870,155 870,475 515,440" fill="#15152b" stroke="#455" stroke-width="2"/>
  <text x="130" y="145" fill="#88CCEE" font-family="sans-serif" font-size="22" font-weight="700">2024.1</text>
  <text x="755" y="145" fill="#88CCEE" font-family="sans-serif" font-size="22" font-weight="700">2024.2</text>
  <line x1="270" y1="270" x2="690" y2="270" stroke="#009E73" stroke-width="5" marker-end="url(#arrow)"/>
  <circle cx="270" cy="270" r="25" fill="#0072B2" stroke="#fff" stroke-width="3"/>
  <circle cx="690" cy="270" r="30" fill="#0072B2" stroke="#fff" stroke-width="3"/>
  <text x="150" y="330" fill="#e0e0e0" font-family="sans-serif" font-size="18">lumen-cache v1.0.0</text>
  <text x="585" y="330" fill="#e0e0e0" font-family="sans-serif" font-size="18">lumen-cache v1.1.0</text>
  <text x="390" y="245" fill="#009E73" font-family="sans-serif" font-size="16" font-weight="700">crossRelease</text>
  <text x="48" y="505" fill="#9aa" font-family="sans-serif" font-size="15">Z axis = revision; green edge = continuity between adjacent revisions.</text>
</svg>
