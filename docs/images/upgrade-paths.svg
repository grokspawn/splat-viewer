<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Upgrade paths</title>
  <desc id="desc">Replaces, skips, and skipRange edges for lumen cache bundles.</desc>
  <defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#56B4E9"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#E69F00"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D55E00"/></marker></defs>
  <rect width="960" height="540" fill="#0a0a1a"/>
  <text x="48" y="52" fill="#e0e0e0" font-family="sans-serif" font-size="28" font-weight="700">Upgrade paths</text>
  <text x="48" y="82" fill="#9aa" font-family="sans-serif" font-size="16">Focused on one package to make edge semantics readable.</text>
  <line x1="180" y1="180" x2="725" y2="180" stroke="#56B4E9" stroke-width="4" marker-end="url(#blue)"/>
  <line x1="180" y1="300" x2="725" y2="180" stroke="#E69F00" stroke-width="3" marker-end="url(#orange)"/>
  <line x1="180" y1="420" x2="725" y2="180" stroke="#D55E00" stroke-width="2" stroke-dasharray="10 8" marker-end="url(#red)"/>
  <circle cx="180" cy="180" r="25" fill="#0072B2"/><circle cx="180" cy="300" r="25" fill="#0072B2"/><circle cx="180" cy="420" r="25" fill="#0072B2"/>
  <circle cx="725" cy="180" r="34" fill="#0072B2" stroke="#fff" stroke-width="3"/>
  <text x="75" y="175" fill="#e0e0e0" font-family="sans-serif" font-size="17">v1.0.0</text>
  <text x="75" y="295" fill="#e0e0e0" font-family="sans-serif" font-size="17">v0.9.0</text>
  <text x="75" y="415" fill="#e0e0e0" font-family="sans-serif" font-size="17">v0.8.0</text>
  <text x="745" y="175" fill="#e0e0e0" font-family="sans-serif" font-size="17">v1.1.0</text>
  <text x="380" y="165" fill="#56B4E9" font-family="sans-serif" font-size="16">replaces</text>
  <text x="400" y="275" fill="#E69F00" font-family="sans-serif" font-size="16">skips</text>
  <text x="410" y="390" fill="#D55E00" font-family="sans-serif" font-size="16">skipRange</text>
  <text x="48" y="505" fill="#9aa" font-family="sans-serif" font-size="15">Enable --skip-range-edges to materialize skipRange links.</text>
</svg>
